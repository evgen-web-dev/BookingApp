# Host-only development stack: postgres + adminer for running the API from the
# IDE on the host (appsettings.Development.json points at localhost).
# NOT the devcontainer stack — .devcontainer/docker-compose.yml has its own.
# Do not run both: they collide on 127.0.0.1:5432 and :8080, and their pgdata
# volumes are project-prefixed, so each stack has its own database.

services:
  postgres:
    image: postgres:16
    container_name: booking_app_db
    environment:
      POSTGRES_DB: booking_app
      POSTGRES_USER: booking_app_user
      POSTGRES_PASSWORD: booking_app_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - booking_app_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: booking_app_adminer
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  booking_app_pgdata: